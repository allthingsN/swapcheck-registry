name: update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: registry-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm test
      - name: Fetch, parse, diff and sign
        env:
          REGISTRY_SIGNING_KEY_PEM: ${{ secrets.REGISTRY_SIGNING_KEY_PEM }}
        run: node scripts/update.ts
      - name: Open issues for parsers that stopped matching
        if: ${{ !cancelled() && hashFiles('out/run-report.json') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/open-issues.ts out/run-report.json
      - name: Propose the change
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/propose-change.ts
