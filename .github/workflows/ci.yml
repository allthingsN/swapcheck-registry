name: ci

# Tests every pull request and every push to main. The scheduled update also runs these tests
# before it signs anything, because pushes made with GITHUB_TOKEN do not start this workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm test
      - name: Snapshot verifies against the pinned public key
        run: node scripts/verify.ts
